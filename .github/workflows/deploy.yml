name: Deploy to GitHub Pages (Ji-Peng.github.io)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'deploy-pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Ji-Peng.github.io
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          git clone git@github.com:Ji-Peng/Ji-Peng.github.io.git deploy_repo
          cd deploy_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rsync -av --delete --exclude='.git' --exclude='.gitignore' ../dist/ ./
          git add -A
          if ! git diff --cached --quiet; then
            MSG="${COMMIT_MSG:-update}"
            FIRST_LINE=$(echo "$MSG" | head -n 1)
            git commit -m "$FIRST_LINE"
            git push origin main
            echo "Successfully deployed to Ji-Peng.github.io! 🚀"
          else
            echo "No changes detected in build output. Nothing to deploy."
          fi

